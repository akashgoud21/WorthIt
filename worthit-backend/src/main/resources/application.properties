# ============================================================
#  WorthIt Backend - Application Configuration
#  File: src/main/resources/application.properties
# ============================================================

spring.application.name=worthit-backend
server.port=8080

# ============================================================
#  MYSQL DATABASE CONFIGURATION
#  ACTION REQUIRED: Replace YOUR_PASSWORD with your MySQL root password
# ============================================================

spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool settings
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# ============================================================
#  JPA / HIBERNATE CONFIGURATION
# ============================================================

# Dialect tells Hibernate which SQL flavor to generate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 'update' = create tables if they don't exist, add new columns if entities changed
# WARNING: Change this to 'validate' in production (after tables are created)
spring.jpa.hibernate.ddl-auto=update

# Print the generated SQL in the console (useful for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable open-in-view for clean transactional view rendering
spring.jpa.open-in-view=true

# ============================================================
#  FILE UPLOAD CONFIGURATION
# ============================================================

# Maximum size for a single uploaded file (invoice/warranty doc)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Directory where uploaded files are saved on the server
# This is a relative path — files go inside worthit-backend/uploads/
app.upload.dir=uploads

# ============================================================
#  LOGGING
# ============================================================
logging.level.com.worthit=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
